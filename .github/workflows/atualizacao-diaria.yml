name: Atualizar e publicar Observatório 2026
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar notícias e referências públicas indexadas
        if: github.event_name != 'push'
        run: |
          python scripts/update_news.py
          python scripts/update_social.py
      - name: Salvar feeds
        if: github.event_name != 'push'
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add data/news.json data/social.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar fontes públicas em análise"
            git push
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Montar conteúdo público
        run: |
          mkdir -p public/data
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png public/
          cp data/registry.json data/news.json data/social.json public/data/
          python -m pip install -q pillow
          python -c "from PIL import Image; Image.open('icon-192.png').resize((512,512)).save('public/icon-512.png',optimize=True)"
          touch public/.nojekyll
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
